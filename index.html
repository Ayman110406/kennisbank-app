<style>
/* Layout: smalle kolom (max 720px), kopbalk bovenaan, tabbalk onderaan. Het leerpad is een lijst op volgorde met een voortgangsbalk. */
:root {

}
@media (prefers-color-scheme: dark) {

}

  --accent: #59B8D6; --accent-ink: #06141B; --done: #47C48C; --done-bg: #12352A;

* { box-sizing: border-box; }
body {

.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }

function snippet(d, words) {

function toetsData() {

        ${(f.sterk && f.sterk.length) ? `<p class="sn" style="margin:0 0 6px">Sterk</p><div class="chips" style="margin-bottom:10px">${f.sterk.map(x => `<span class="chip done">${esc(x)}</span>`).join("")}</div>` : ""}

/* ---------- toetsen maken ---------- */
const TOETS_KEY = f => "lezer.toets." + f;
const r2 = n => Math.round(n * 100) / 100;
const nf = n => String(r2(n));                       // bestand: punt als decimaal
const nl = n => nf(n).replace(".", ",");             // scherm: komma
const normAns = s => String(s ?? "").toLowerCase().replace(/\s+/g, " ").trim();
const p2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const hhmm = d => p2(d.getHours()) + p2(d.getMinutes());
const NIET = "(niet beantwoord)";

/* parser: toets.md -> vragen */
function parseToets(d) {
  const i = d.body.search(/^## Vragen\s*$/m);
  const src = i < 0 ? d.body : d.body.slice(i);
  const parts = src.split(/^(?=### V\d+ · )/m).filter(p => /^### V\d+ · /.test(p));
  const vragen = [], warn = [];
  for (const p of parts) {
    const m = p.match(/^### (V\d+) · ([a-z-]+) · (\d+(?:[.,]\d+)?) punten?[^\n]*\n?/);
    if (!m) { warn.push("kop niet herkend: " + p.split("\n")[0]); continue; }
    let rest = p.slice(m[0].length);
    const cut = rest.search(/^## /m); if (cut >= 0) rest = rest.slice(0, cut);
    const q = { id: m[1], type: m[2], max: parseFloat(m[3].replace(",", ".")), opties: [], f: {} };
    const re = /^\*\*([A-Za-z]+):\*\*[ \t]*/gm, hits = []; let x;
    while ((x = re.exec(rest))) hits.push({ k: x[1], s: x.index, e: re.lastIndex });
    const head = rest.slice(0, hits.length ? hits[0].s : rest.length);
    hits.forEach((h, n) => { q.f[h.k] = rest.slice(h.e, n + 1 < hits.length ? hits[n + 1].s : rest.length).trim(); });
    const stem = [];
    for (const line of head.split("\n")) {
      const o = line.match(/^- ([A-H])\. (.*)$/);
      if (o) q.opties.push({ k: o[1], t: o[2].trim() }); else stem.push(line);
    }
    q.stem = stem.join("\n").trim();
    q.thema = q.f.Thema || ""; q.uitleg = q.f.Uitleg || "";
    const on = (q.f.Onderwerp || "").match(/\[([^\]]+)\]/); q.onderwerp = on ? on[1] : (q.f.Onderwerp || "");
    q.beoordeling = q.f.Beoordeling || ""; q.voorbeeld = q.f.Voorbeeldantwoord || "";
    if (q.type === "waar-onwaar") q.opties = [{ k: "waar", t: "Waar" }, { k: "onwaar", t: "Onwaar" }];
    if (q.type === "meerdere-juist") q.juist = (q.f.Antwoord || "").split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
    else if (q.type === "invul") q.juist = (q.f.Antwoord || "").split(" | ").map(s => s.trim()).filter(Boolean);
    else if (q.type === "meerkeuze") q.juist = (q.f.Antwoord || "").trim().toUpperCase();
    else if (q.type === "waar-onwaar") q.juist = (q.f.Antwoord || "").trim().toLowerCase();
    else if (q.type !== "open") warn.push(q.id + ": onbekend type " + q.type);
    if (q.type !== "open" && !q.f.Antwoord) warn.push(q.id + ": geen antwoord");
    if (q.type === "open" && !q.voorbeeld) warn.push(q.id + ": geen voorbeeldantwoord");
    if ((q.type === "meerkeuze" || q.type === "meerdere-juist") && q.opties.length < 2) warn.push(q.id + ": geen antwoordopties");
    vragen.push(q);
  }
  return { vragen, warn, totaal: r2(vragen.reduce((s, q) => s + q.max, 0)) };
}

/* nakijken: één vraag */
const answered = (q, a) => q.type === "meerdere-juist" ? Array.isArray(a) && a.length > 0 : typeof a === "string" && a.trim() !== "";
function gradeQ(q, a) {
  const has = answered(q, a), optTxt = k => { const o = q.opties.find(o => o.k === k); return o ? (q.type === "waar-onwaar" ? o.t : k + ". " + o.t) : String(k); };
  const row = { id: q.id, type: q.type, max: q.max, thema: q.thema, onderwerp: q.onderwerp, stem: q.stem, uitleg: q.uitleg, pts: 0 };
  if (q.type === "meerkeuze" || q.type === "waar-onwaar") {
    const ok = has && a === q.juist;
    Object.assign(row, { res: ok ? "goed" : "fout", pts: ok ? q.max : 0, gegeven: has ? a : NIET, juist: q.juist, gegL: has ? [optTxt(a)] : [NIET], juistL: [optTxt(q.juist)] });
  } else if (q.type === "meerdere-juist") {
    const ch = has ? a.slice().sort() : [], n = q.juist.length, g = ch.filter(k => q.juist.includes(k)).length, f = ch.length - g;
    const pts = r2(q.max * Math.max(0, (g - f) / n));
    Object.assign(row, { res: f === 0 && g === n ? "goed" : pts > 0 ? "deels" : "fout", pts, gegeven: has ? ch.join(",") : NIET, juist: q.juist.join(","), gegL: has ? ch.map(optTxt) : [NIET], juistL: q.juist.map(optTxt) });
  } else if (q.type === "invul") {
    const ok = has && q.juist.some(j => normAns(j) === normAns(a));
    Object.assign(row, { res: ok ? "goed" : "fout", pts: ok ? q.max : 0, gegeven: has ? a.replace(/\s+/g, " ").trim() : NIET, juist: q.juist.join(" | "), gegL: [has ? a.trim() : NIET], juistL: [q.juist.join(" | ")] });
  } else {
    Object.assign(row, { res: "nog na te kijken", pts: 0, gegeven: has ? a.trim() : NIET, juist: q.voorbeeld, gegL: [has ? a.trim() : NIET], juistL: [q.voorbeeld], uitleg: q.voorbeeld, beoordeling: q.beoordeling, voorbeeld: true });
  }
  return row;
}

/* poging als markdown, volgens 11-templates/poging.md */
function fld(label, text) {

  if (!t.includes("\n")) return `**${label}:** ${t}\n`;
  return `**${label}:**\n` + t.split("\n").map(l => "> " + l).join("\n") + "\n\n";
}
function buildPoging(u, N, at) {
  const titel = `${u.titel}, poging ${N}`;

  const today = ymd(new Date()), auto = u.rows.filter(r => r.type !== "open").reduce((s, r) => s + r.pts, 0);
  let t = `---\ntitel: ${yq}\ntype: poging\nstatus: ingeleverd\naangemaakt: ${today}\nbijgewerkt: ${today}\ntags: []\ntoets: ${u.folder}\ntoetsversie: ${u.versie}\ndatum: ${ymd(at)}\nduur: ${u.duur}\nscore_automatisch: ${nf(auto)}\nscore:\nmaximaal: ${nf(u.maximaal)}\npercentage:\nsterk: []\nzwak: []\n---\n\n# ${titel}\n\n## Antwoorden\n`;
  for (const r of u.rows) {
    t += `\n### ${r.id} · ${r.type} · ${nf(r.pts)} van ${nf(r.max)} punten\n\n**Thema:** ${r.thema}\n${fld("Gegeven", r.gegeven)}${fld("Juist", r.juist)}**Resultaat:** ${r.res}\n`;
  }
  return t + `\n## Feedback\n\n### Wat ging goed\n\n### Wat beter kan\n\n### Volgende stap\n`;
}

  return { html: `${bar}<div class="qmeta"><span>Vraag ${i + 1} van ${total} · ${done} beantwoord</span><button class="qlink" data-act="toverzicht" data-folder="${esc(folder)}">Overzicht</button></div><div class="qsync" id="tsync">${tSyncHtml(folder)}</div>
    <div class="chips" style="margin:14px 0 0"><span class="chip">${esc(hint)}</span><span class="chip">${nl(q.max)} ${q.max === 1 ? "punt" : "punten"}</span></div>

function tResult(t, st) {

/* concept in git: 7-toetsen/<toets>/concept.md (één lopend concept per toets, ook leesbaar voor de site) */
const CT = {}, CRUN = {};
const isoT = ms => new Date(ms).toISOString();
function buildConcept(st, qs, titel, folder, gew) {
  const tt = titel + ", concept", yq = /[:#"']/.test(tt) ? JSON.stringify(tt) : tt;
  let t = `---\ntitel: ${yq}\ntype: concept\nstatus: bezig\naangemaakt: ${ymd(new Date(st.start))}\nbijgewerkt: ${ymd(new Date(gew))}\ntags: []\ntoets: ${folder}\ntoetsversie: ${st.v}\ngestart: ${isoT(st.start)}\ngewijzigd: ${isoT(gew)}\napparaat: app\npositie: ${(st.idx || 0) + 1}\n---\n\n# ${tt}\n\n## Antwoorden\n`;
  for (const q of qs) {
    const a = st.answers[q.id]; if (!answered(q, a)) continue;
    t += `\n### ${q.id}\n\n${fld("Gegeven", q.type === "meerdere-juist" ? a.slice().sort().join(",") : String(a).trim())}`;
  }
  return t;
}
function parseConcept(text, qs) {
  const d = parseDoc("concept.md", text), type = {}; qs.forEach(q => type[q.id] = q.type);
  const answers = {};
  for (const blk of d.body.split(/^(?=### V\d+\s*$)/m)) {
    const id = (blk.match(/^### (V\d+)\s*$/m) || [])[1], m = blk.match(/\*\*Gegeven:\*\*([\s\S]*)$/); if (!id || !m || !type[id]) continue;
    let v = m[1];
    if (/^[ \t]*\n/.test(v)) v = v.split("\n").filter(l => l.startsWith(">")).map(l => l.replace(/^> ?/, "")).join("\n"); else v = v.trim();
    if (!v.trim()) continue;
    answers[id] = type[id] === "meerdere-juist" ? v.split(",").map(s => s.trim()).filter(Boolean).sort() : v;
  }
  const g = Date.parse(d.fm.gewijzigd), s = Date.parse(d.fm.gestart);
  return { gew: isFinite(g) ? g : 0, start: isFinite(s) ? s : Date.now(), v: d.fm.toetsversie, idx: Math.max(0, (Number(d.fm.positie) || 1) - 1), apparaat: d.fm.apparaat || "", answers };
}
async function fetchConcept(cfg, folder, ref) {

const httpErr = (status, msg) => Object.assign(new Error(msg), { status });

  catch (e) { throw httpErr(0, "Geen verbinding met GitHub."); }
  if (r.status === 401) throw httpErr(401, "Het token is ongeldig of verlopen.");
  if (r.status === 403 || r.status === 404) throw httpErr(r.status, "Opslaan niet gelukt: het token mist schrijfrechten. Zet bij het token Contents op Read and write. (GitHub " + r.status + ")");
  if (!r.ok) throw httpErr(r.status, "Opslaan niet gelukt (GitHub fout " + r.status + ").");
  return r.json();
}

  const cfg = store.get("lezer.cfg", {});
  if (!cfg.token) { S.setup = true; route(); return; }
  const key = "docs:" + cfg.repo + "@" + cfg.branch;
  try {
    if (!silent) pill("Laden…");
    const tree = await gh(cfg, `/repos/${cfg.repo}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
    S.concepts = {}; for (const t of tree.tree) { const m = t.path.match(/^7-toetsen\/([^/]+)\/concept\.md$/); if (m) S.concepts[m[1]] = true; }
    const entries = tree.tree.filter(t => t.type === "blob" && includeFile(t.path));
    const cache = (await idbGet(key)) || { shas: {}, files: {} };
    const files = {}, shas = {}; let done = 0, i = 0;
    const work = async () => {
      while (i < entries.length) {
        const e = entries[i++];
        if (cache.shas[e.path] === e.sha && cache.files[e.path] != null) files[e.path] = cache.files[e.path];
        else files[e.path] = await gh(cfg, `/repos/${cfg.repo}/git/blobs/${e.sha}`, "application/vnd.github.raw+json");
        shas[e.path] = e.sha; done++; if (!silent && done % 10 === 0) pill(`Laden… ${done} van ${entries.length}`);
      }
    };
    await Promise.all(Array.from({ length: 8 }, work));
    let commits = [];
    try {
      const cs = await gh(cfg, `/repos/${cfg.repo}/commits?sha=${encodeURIComponent(cfg.branch)}&per_page=100`);
      commits = cs.map(c => ({ sha: c.sha.slice(0, 7), date: c.commit.author.date, msg: c.commit.message.split("\n")[0] }));
    } catch (e) {}
    const sig = Object.keys(shas).sort().map(k => k + shas[k]).join("|") + "#" + (commits[0] ? commits[0].sha : "") + "#" + Object.keys(S.concepts).join(",");
    const same = silent && S.sig === sig && S.docs.length;
    S.sig = sig; S.meta = { mode: "live", when: clock() }; S.setup = false;
    if (same) refreshStatus();
    else { ingest(files); S.commits = commits; route(); }
    if (!silent) pill("Bijgewerkt", 1500);
    idbSet(key, { shas, files });
  } catch (err) { if (!silent || !S.docs.length) pill(err.message, 6000); if (!S.docs.length) { S.setup = true; route(); } }
}

/* ---------- start ---------- */
async function boot() {
  applyTheme();
  if (SNAPSHOT) {
    ingest(SNAPSHOT.files); S.commits = SNAPSHOT.commits || [];
    S.meta = { mode: "snapshot", date: SNAPSHOT.generated, sha: SNAPSHOT.sha };
    route(); return;
  }
  const cfg = store.get("lezer.cfg", {});
  if (!cfg.token) { S.setup = true; route(); return; }
  const cached = await idbGet("docs:" + cfg.repo + "@" + cfg.branch);
  if (cached) { ingest(cached.files); S.meta = { mode: "live", when: "uit cache" }; route(); }
  await syncAll(false, true);
  scheduleFlush(); tResume();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPending(); });
  window.addEventListener("pagehide", () => { flushPending(); });
  setInterval(() => { if (document.visibilityState === "visible") syncAll(true); }, SYNC_MS);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { tResume(); if (Date.now() - (S.lastSync || 0) >= SYNC_MS) syncAll(true); } });
}
boot();
</script>
