<style>
/* Layout: smalle kolom (max 720px), kopbalk bovenaan, tabbalk onderaan. Het leerpad is een lijst op volgorde met een voortgangsstrip: een tik per onderwerp. */
:root {

.btn { display: inline-block; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 11px 18px; border-radius: 12px; cursor: pointer; }

<script>
const SNAPSHOT = /*__SNAPSHOT__*/null;
const DEFAULT_REPO = "Ayman110406/kennisbank";
const SECTIONS = { "1-kennis": "kennis", "2-technologie": "technologie", "3-werkwijzen": "werkwijze" };
const SITE_PREFIXES = ["Behandeld:", "Toets:"];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- iconen ---------- */
const IC = {
  home: '<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
  path: '<path d="M5 4v16M5 6h9a3 3 0 010 6H8a3 3 0 000 6h11"/>',

  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- frontmatter en documenten ---------- */
function unq(v) {
  if (v.length > 1 && v[0] === "'" && v.endsWith("'")) return v.slice(1, -1).replace(/''/g, "'");
  if (v.length > 1 && v[0] === '"' && v.endsWith('"')) return v.slice(1, -1).replace(/\\"/g, '"');
  return v;
}
function splitList(s) {
  const out = []; let cur = "", q = null;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === q) { if (q === "'" && s[i + 1] === "'") { cur += "'"; i++; } else q = null; } else cur += c; }
    else if (c === "'" || c === '"') q = c;
    else if (c === ",") { out.push(cur.trim()); cur = ""; }
    else cur += c;
  }
  out.push(cur.trim());
  return out.filter(x => x !== "");
}
function fmVal(v) {
  if (v === "") return "";
  if (v[0] === "[" && v.endsWith("]")) return splitList(v.slice(1, -1));
  if (v === "true") return true;
  if (v === "false") return false;
  return unq(v);
}
function slugOf(path) { return path.replace(/\.md$/, "").toLowerCase().replace(/\//g, "--").replace(/[^a-z0-9-]/g, "-"); }
function parseDoc(path, text) {
  let fm = {}, body = text;
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (m) {
    body = text.slice(m[0].length);
    for (const line of m[1].split(/\r?\n/)) {
      const i = line.indexOf(":");
      if (i < 1 || /^\s/.test(line)) continue;
      fm[line.slice(0, i).trim()] = fmVal(line.slice(i + 1).trim());

  const h1 = body.match(/^#\s+(.+)$/m);
  const base = path.split("/").pop().replace(/\.md$/, "");
  return { path, slug: slugOf(path), fm, body, section: path.split("/")[0],
    title: fm.titel || (h1 && h1[1]) || base, type: fm.type || "", folder: path.split("/").slice(0, -1).join("/") };
}
function includeFile(p) {
  if (!p.endsWith(".md")) return false;
  const top = p.split("/")[0], name = p.split("/").pop();
  if (name === "CLAUDE.md") return false;
  if (!p.includes("/") && name === "README.md") return false;
  return !["11-templates", "9-export", "10-inbox"].includes(top) && !top.startsWith(".");
}

const S = { docs: [], byPath: {}, bySlug: {}, topics: [], commits: [], meta: {}, hiddenCommits: 0 };
function ingest(files) {
  S.docs = Object.keys(files).filter(includeFile).sort().map(p => parseDoc(p, files[p]));
  S.byPath = {}; S.bySlug = {};
  for (const d of S.docs) { S.byPath[d.path] = d; S.bySlug[d.slug] = d; }
  S.topics = S.docs.filter(d => SECTIONS[d.section] && ["kennis", "technologie", "werkwijze"].includes(d.type))
    .sort((a, b) => ord(a) - ord(b) || a.title.localeCompare(b.title));
  S.byTitle = {};
  for (const t of S.topics) S.byTitle[t.title.toLowerCase()] = t;
}
const ord = d => { const n = Number(d.fm.volgorde); return isFinite(n) && d.fm.volgorde !== "" ? n : 1e9; };
const isDone = d => d.fm.behandeld === true;
const isBasis = d => d.fm.basis === true;

/* ---------- markdown ---------- */
function resolvePath(base, rel) {
  let r; try { r = decodeURIComponent(rel); } catch (e) { r = rel; }
  const parts = r.startsWith("/") ? [] : base.split("/").slice(0, -1);
  for (const seg of r.split("/")) { if (seg === "." || seg === "") continue; if (seg === "..") parts.pop(); else parts.push(seg); }
  return parts.join("/");
}
function mdLink(t, u, ctx) {
  if (/^https?:\/\//i.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
  if (u[0] === "#" || /^[a-z][a-z0-9+.-]*:/i.test(u)) return t;
  const d = S.byPath[resolvePath(ctx.path, u.split("#")[0])];
  return d ? `<a class="in" href="#${d.slug}">${t}</a>` : `<span class="dead">${t}</span>`;
}
function inline(s, ctx) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, t, u) => mdLink(t, u.replace(/&amp;/g, "&"), ctx));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(>])\*([^*\s][^*]*)\*(?=[\s).,;:!?<]|$)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[\s(>])_([^_\s][^_]*)_(?=[\s).,;:!?<]|$)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => "<code>" + esc(codes[i]) + "</code>");
}
const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const startsBlock = l => /^```/.test(l) || /^#{1,6}\s/.test(l) || /^>/.test(l) || LI.test(l) || /^\s*(---|\*\*\*|___)\s*$/.test(l);
function mdList(lines, i, ctx) {
  const items = [];
  while (i < lines.length) {
    const l = lines[i], m = l.match(LI);
    if (m) { items.push({ ind: m[1].replace(/\t/g, "    ").length, ord: /\d/.test(m[2]), text: m[3] }); i++; continue; }
    if (/^\s*$/.test(l)) {
      let j = i + 1; while (j < lines.length && /^\s*$/.test(lines[j])) j++;
      if (j < lines.length && LI.test(lines[j])) { i = j; continue; }
      break;
    }
    if (/^\s+\S/.test(l) && items.length) { items[items.length - 1].text += " " + l.trim(); i++; continue; }
    break;
  }
  let pos = 0;
  const lvl = () => {
    const base = items[pos].ind, tag = items[pos].ord ? "ol" : "ul"; let h = "<" + tag + ">";
    while (pos < items.length && items[pos].ind === base) {
      const it = items[pos++]; let li = inline(it.text, ctx);
      if (pos < items.length && items[pos].ind > base) li += lvl();

      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" data-act="saveCfg">Opslaan en laden</button><button class="btn ghost" data-act="reload">Opnieuw laden</button><button class="btn ghost" data-act="clearCfg">Token wissen</button></div></div>`;
  return { html: `<h1 class="page">Instellingen</h1><h2 class="sec">Weergave</h2><div class="seg" role="group" aria-label="Thema">${seg("auto", "Automatisch")}${seg("light", "Licht")}${seg("dark", "Donker")}</div>${live}` };
}
function viewSetup() {
  return { html: `<h1 class="page">Kennisbank</h1><p class="sub">Verbind de lezer één keer met GitHub.</p>
    <div class="card" style="margin-top:14px"><ol class="steps" style="margin:0">
      <li>Maak bij GitHub een <b>fine-grained token</b> met alleen deze repository en het recht <b>Contents: Read-only</b>.</li>
      <li>Plak het token hieronder en kies Opslaan. Het blijft alleen op dit apparaat.</li></ol>
      <label class="f" for="repo">Repository</label><input id="repo" type="text" value="${esc(DEFAULT_REPO)}" autocapitalize="off" autocomplete="off">
      <label class="f" for="branch">Branch</label><input id="branch" type="text" value="main" autocapitalize="off" autocomplete="off">
      <label class="f" for="token">Token</label><input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
      <div style="margin-top:16px"><button class="btn" data-act="saveCfg">Opslaan en laden</button></div></div>` };
}

/* ---------- documentpagina's ---------- */
function parentOf(d) {
  if (SECTIONS[d.section]) return "v-leerpad";
  if (d.section === "4-projecten") return "v-projecten";
  if (d.section === "5-doel") return "v-doelen";
  if (d.section === "6-logboek") return "v-logboek";
  if (d.section === "7-toetsen") return "v-toetsen";
  return "v-start";
}
function factRow(k, v) { return v === "" || v == null || (Array.isArray(v) && !v.length) ? "" : `<dt>${k}</dt><dd>${v}</dd>`; }
function viewDoc(d) {
  const f = d.fm, isTopic = S.topics.includes(d);
  let head = "", tail = "";
  const where = d.path.split("/").slice(0, -1).join(" / ");
  if (isTopic) {
    head = `<div class="chips" style="margin:12px 0 4px">${chip(d.type)}${f.domein ? chip(f.domein) : ""}${f.soort ? chip(f.soort) : ""}${isBasis(d) ? chip("basis", "open") : ""}${isDone(d) ? chip("behandeld", "done") : chip("nog niet behandeld")}${statusChip(d)}</div>
      <p class="sn">bijgewerkt ${esc(fmtDate(f.bijgewerkt))}</p>${f.tags && f.tags.length ? `<div class="chips" style="margin-top:8px">${f.tags.map(t => `<span class="chip mono">${esc(t)}</span>`).join("")}</div>` : ""}`;
    const i = S.topics.indexOf(d), p = S.topics[i - 1], n = S.topics[i + 1];
    tail = `<nav class="pn" aria-label="Volgende onderwerpen">${p ? `<a href="#${p.slug}"><span>vorige</span><b>${esc(p.title)}</b></a>` : "<span></span>"}${n ? `<a class="next" href="#${n.slug}"><span>volgende</span><b>${esc(n.title)}</b></a>` : ""}</nav>`;
  } else if (/\/project\.md$/.test(d.path)) {
    const tech = (f.technieken || []).map(t => { const m = S.byTitle[String(t).toLowerCase()]; return m ? `<a class="chip" href="#${m.slug}">${esc(t)}</a>` : `<span class="chip">${esc(t)}</span>`; }).join("");
    const repo = /^https?:\/\//.test(f.repo || "") ? `<a href="${esc(f.repo)}" target="_blank" rel="noopener noreferrer">${esc(f.repo.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : "";
    head = `<div class="card" style="margin:14px 0"><dl class="kv">${factRow("Herkomst", esc(f.herkomst))}${factRow("Periode", esc(f.periode))}${factRow("Rol", esc(f.rol))}${factRow("Cijfer", esc(f.cijfer))}${factRow("Status", esc(f.status))}${factRow("Repo", repo)}</dl></div>
      ${tech ? `<p class="sn" style="margin:0 0 6px">Technieken</p><div class="chips" style="margin-bottom:8px">${tech}</div>` : ""}`;
  } else if (d.section === "5-doel") {
    head = `<div class="chips" style="margin:12px 0">${statusChip(d)}${f.streefdatum ? chip("streefdatum " + fmtDate(f.streefdatum)) : ""}${f.behaald ? chip("behaald " + fmtDate(f.behaald), "done") : ""}</div>`;
  } else if (d.section === "6-logboek") {
    head = `<div class="chips" style="margin:12px 0">${chip(fmtDate(f.datum, true))}${statusChip(d)}</div>${f.tags && f.tags.length ? `<div class="chips" style="margin-bottom:8px">${f.tags.map(t => `<span class="chip mono">${esc(t)}</span>`).join("")}</div>` : ""}`;
  } else if (d.section === "7-toetsen") {
    const t = toetsData().find(x => d.path.startsWith("7-toetsen/" + x.folder + "/"));
    if (/\/toets\.md$/.test(d.path) && t) {
      head = `<div class="card" style="margin:14px 0">${spark(t.scores) || '<span class="sn">Nog geen pogingen</span>'}${themeList(t)}</div>
        ${t.pogingen.length ? `<h2 class="sec" style="margin-top:8px">Pogingen</h2><div class="card pad0 list" style="margin-bottom:20px">${t.pogingen.slice().reverse().map(p => {
          const v = parseFloat(String(p.fm.percentage).replace(",", "."));
          return `<a class="row" href="#${p.slug}"><span class="main"><span class="t">${esc(fmtDate(p.fm.datum, true))}</span><br><span class="m">${esc(p.fm.status || "")}${p.fm.duur ? " · " + esc(p.fm.duur) + " min" : ""}</span></span>
            ${isFinite(v) ? `<span class="bar"><b style="width:${Math.max(0, Math.min(100, v))}%"></b></span><span class="pct">${Math.round(v)}%</span>` : '<span class="chip">na te kijken</span>'}</a>`; }).join("")}</div>` : ""}`;
    } else if (/pogingen\//.test(d.path)) {
      head = `<div class="card" style="margin:14px 0"><dl class="kv">${factRow("Datum", esc(fmtDate(f.datum, true)))}${factRow("Score", f.score !== "" && f.score != null ? esc(f.score) + (f.maximaal ? " van " + esc(f.maximaal) : "") : "")}${factRow("Percentage", f.percentage !== "" ? esc(f.percentage) + "%" : "")}${factRow("Status", esc(f.status))}${factRow("Toetsversie", esc(f.toetsversie))}</dl></div>
        ${(f.sterk && f.sterk.length) ? `<p class="sn" style="margin:0 0 6px">Sterk</p><div class="chips" style="margin-bottom:10px">${f.sterk.map(x => `<span class="chip done">${esc(x)}</span>`).join("")}</div>` : ""}
        ${(f.zwak && f.zwak.length) ? `<p class="sn" style="margin:0 0 6px">Zwak</p><div class="chips" style="margin-bottom:10px">${f.zwak.map(x => `<span class="chip open">${esc(x)}</span>`).join("")}</div>` : ""}`;
    }
  }
  return { html: `<p class="kicker">${esc(where)}</p><h1 class="page">${esc(d.title)}</h1>${head}<article class="prose" style="margin-top:18px">${md(d.body, d)}</article>${tail}`, parent: parentOf(d), title: kindLabel(d) };
}

/* ---------- router ---------- */
let depth = 0;
function topbar(route, info) {
  const top = !info.parent;
  const right = `<a class="ibtn" href="#v-zoek" aria-label="Zoeken">${icon("search")}</a>`;
  return `<header class="top">${top ? "" : `<button class="ibtn" data-act="back" data-parent="${info.parent}" aria-label="Terug">${icon("back")}</button>`}
    <div class="ttl">${top ? "" : esc(info.title || "")}</div>${right}</header>`;
}
function tabbar(tab) {
  const t = (id, href, ic, label) => `<a href="#${href}" data-reset="1" ${tab === id ? 'aria-current="page"' : ""}>${icon(ic)}<span>${label}</span></a>`;
  return `<div class="tabs"><nav aria-label="Hoofdmenu">${t("start", "", "home", "Start")}${t("leerpad", "v-leerpad", "path", "Leerpad")}${t("projecten", "v-projecten", "folder", "Projecten")}${t("meer", "v-meer", "more", "Meer")}</nav></div>`;
}
function route() {
  const app = $("#app"), h = location.hash.slice(1);
  let view, info = {}, tab = "start";
  if (S.setup) { app.innerHTML = viewSetup().html; return; }
  if (!h) { view = viewStart(); }
  else if (VIEWS[h]) {
    info = VIEWS[h]; tab = info.tab;
    view = { start: viewStart, leerpad: viewLeerpad, projecten: viewProjecten, meer: viewMeer }[h.slice(2)] || ({ zoek: viewZoek, doelen: viewDoelen, logboek: viewLogboek, toetsen: viewToetsen, over: viewOver, instellingen: viewInstellingen }[h.slice(2)]);
    view = view();
  } else if (S.bySlug[h]) {
    const d = S.bySlug[h]; view = viewDoc(d); info = { parent: view.parent, title: view.title };
    tab = SECTIONS[d.section] ? "leerpad" : d.section === "4-projecten" ? "projecten" : "meer";
  } else { view = { html: '<div class="empty"><b>Pagina niet gevonden</b><a href="#">Naar de start</a></div>' }; info = { parent: "v-start", title: "" }; }
  app.innerHTML = topbar(h, info) + `<main>${view.html}</main>` + tabbar(tab);
  const q = $("#q"); if (q && !q.value) q.focus();
}
function pill(msg, ms) {
  const p = $("#pill"); if (!msg) { p.hidden = true; return; }
  p.textContent = msg; p.hidden = false; if (ms) setTimeout(() => { if (p.textContent === msg) p.hidden = true; }, ms);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (a) { if (a.dataset.reset) depth = 0; else depth++; return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "back") { if (depth > 0) { depth--; history.back(); } else location.hash = b.dataset.parent === "v-start" ? "" : b.dataset.parent; }
  else if (act === "set") { UI[b.dataset.key] = b.dataset.val; store.set("lezer.leerpad", UI); route(); }
  else if (act === "toggleopen") { UI.open = !UI.open; store.set("lezer.leerpad", UI); route(); }
  else if (act === "theme") { store.set("lezer.theme", b.dataset.val); applyTheme(); route(); }
  else if (act === "saveCfg") saveCfg();
  else if (act === "reload") { loadLive(true); }
  else if (act === "clearCfg") { store.del("lezer.cfg"); idbDel("docs"); S.setup = true; S.docs = []; route(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { query = e.target.value; $("#results").innerHTML = searchResults(query); }
});
function applyTheme() {
  const t = store.get("lezer.theme", "auto"), r = document.documentElement;
  if (t === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
}

/* ---------- live laden uit GitHub ---------- */
const IDB = { db: null };
function idb() {
  return IDB.db || (IDB.db = new Promise(res => {
    try { const r = indexedDB.open("kennisbank-lezer", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); }
  }));
}
async function idbGet(k) { const db = await idb(); if (!db) return undefined; return new Promise(res => { try { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); } }); }
async function idbSet(k, v) { const db = await idb(); if (!db) return; return new Promise(res => { try { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } }); }
async function idbDel(k) { const db = await idb(); if (!db) return; try { db.transaction("kv", "readwrite").objectStore("kv").delete(k); } catch (e) {} }
function saveCfg() {
  const old = store.get("lezer.cfg", {});
  const cfg = Object.assign({}, old, { repo: $("#repo").value.trim() || DEFAULT_REPO, branch: $("#branch").value.trim() || "main" });
  const tk = $("#token").value.trim(); if (tk) cfg.token = tk;
  if (!cfg.token) { pill("Plak eerst een token.", 3000); return; }
  store.set("lezer.cfg", cfg); S.setup = false; loadLive(true);
}
async function gh(cfg, path, accept) {
  const base = cfg.apiBase || "https://api.github.com";
  let r;
  try { r = await fetch(base + path, { headers: { Authorization: "Bearer " + cfg.token, Accept: accept || "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } }); }
  catch (e) { throw new Error("Geen verbinding met GitHub."); }
  if (r.status === 401) throw new Error("Het token is ongeldig of verlopen.");
  if (r.status === 403 || r.status === 404) throw new Error("Geen toegang tot " + cfg.repo + ". Controleer de repository en de rechten van het token.");
  if (!r.ok) throw new Error("GitHub gaf fout " + r.status + ".");
  return accept && accept.includes("raw") ? r.text() : r.json();
}
async function loadLive(force) {
  const cfg = store.get("lezer.cfg", {});
  if (!cfg.token) { S.setup = true; route(); return; }
  const key = "docs:" + cfg.repo + "@" + cfg.branch;
  try {
    pill("Laden…");
    const tree = await gh(cfg, `/repos/${cfg.repo}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
    const entries = tree.tree.filter(t => t.type === "blob" && includeFile(t.path));
    const cache = (await idbGet(key)) || { shas: {}, files: {} };
    const files = {}, shas = {}; let done = 0, i = 0;
    const work = async () => {
      while (i < entries.length) {
        const e = entries[i++];
        if (cache.shas[e.path] === e.sha && cache.files[e.path] != null) files[e.path] = cache.files[e.path];
        else files[e.path] = await gh(cfg, `/repos/${cfg.repo}/git/blobs/${e.sha}`, "application/vnd.github.raw+json");
        shas[e.path] = e.sha; done++; if (done % 10 === 0) pill(`Laden… ${done} van ${entries.length}`);
      }
    };
    await Promise.all(Array.from({ length: 8 }, work));
    let commits = [];
    try {
      const cs = await gh(cfg, `/repos/${cfg.repo}/commits?sha=${encodeURIComponent(cfg.branch)}&per_page=100`);
      commits = cs.map(c => ({ sha: c.sha.slice(0, 7), date: c.commit.author.date, msg: c.commit.message.split("\n")[0] }));
    } catch (e) {}
    ingest(files); S.commits = commits;
    S.meta = { mode: "live", when: new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }) };
    S.setup = false; route(); pill("Bijgewerkt", 1500);
    idbSet(key, { shas, files });
  } catch (err) { pill(err.message, 6000); if (!S.docs.length) { S.setup = true; route(); } }
}

/* ---------- start ---------- */
async function boot() {
  applyTheme();
  if (SNAPSHOT) {
    ingest(SNAPSHOT.files); S.commits = SNAPSHOT.commits || [];
    S.meta = { mode: "snapshot", date: SNAPSHOT.generated, sha: SNAPSHOT.sha };
    route(); return;
  }
  const cfg = store.get("lezer.cfg", {});
  if (!cfg.token) { S.setup = true; route(); return; }
  const cached = await idbGet("docs:" + cfg.repo + "@" + cfg.branch);
  if (cached) { ingest(cached.files); S.meta = { mode: "live", when: "uit cache" }; route(); }
  await loadLive();
}
boot();
</script>
</body></html>
